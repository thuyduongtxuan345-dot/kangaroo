<!DOCTYPE html>
<html>
<head>
    <title>Kangaroo AR Hiro</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs>
        <a-assets>
            <a-asset-item id="kangaroo-obj" src="12271_Kangaroo_v1_L3.obj"></a-asset-item>
            <a-asset-item id="kangaroo-mtl" src="12271_Kangaroo_v1_L3.mtl"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            <a-entity 
                obj-model="obj: #kangaroo-obj; mtl: #kangaroo-mtl"
                scale="0.05 0.05 0.05" 
                position="0 0 0"
                rotation="-90 0 0">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
