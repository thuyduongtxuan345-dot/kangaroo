<!DOCTYPE html>
<html>
<head>
    <title>Kangaroo AR Fix Scale</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <a-asset-item id="k-obj" src="12271_Kangaroo_v1_L3.obj"></a-asset-item>
            <a-asset-item id="k-mtl" src="12271_Kangaroo_v1_L3.mtl"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            <!-- 1. Khối hộp đỏ dùng để TEST xem Hiro marker có hoạt động không -->
            <a-box position="0 0.2 0" material="color: red;" scale="0.2 0.2 0.2"></a-box>

            <!-- 2. Mô hình Kangaroo (Đã hạ scale xuống 0.001) -->
            <a-entity 
                obj-model="obj: #k-obj; mtl: #k-mtl"
                scale="0.001 0.001 0.001" 
                position="0 0 0"
                rotation="-90 0 0">
            </a-entity>
        </a-marker>

        <a-entity light="type: ambient; color: #FFF; intensity: 1.5"></a-entity>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
